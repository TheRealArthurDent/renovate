name: 🧪 Self-test
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  self-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Self-hosted Renovate
        uses: renovatebot/github-action@1c0cf989c02653fba0efe7ca5772338860ca71dc # v46.3.12
        with:
          configurationFile: config-selftest.json
          token: ${{ secrets.RENOVATE_TOKEN }}
